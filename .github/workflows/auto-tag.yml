name: Auto-tag on version bump

# Turns a deliberate version bump into a release tag, which is what actually
# triggers publishing (see publish.yml).
#
# It fires only when an SDK's manifest version CHANGES between the previous
# commit and this one. A code-only sync tags nothing, so routine mirrors are
# silent — the version number is the release signal, and bumping it is always a
# deliberate act.
#
# Tag shape is `<language>/vX.Y.Z`, matching misarmail-sdks and misarblog-sdks.
# This is not cosmetic: a Go module in the go/ subdirectory is ONLY resolvable
# by a `go/vX.Y.Z` tag, and a bare `vX.Y.Z` would leave `go get` unable to find
# any version at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

# NOTE: flutter is deliberately absent. The product ships ONE pure-Dart
# package per product that works from Dart CLI, Dart server and Flutter on
# all five platforms. The former <product>_flutter packages are
# discontinued on pub.dev and are no longer built or published from here.

jobs:
  tag:
    outputs:
      publish_typescript: ${{ steps.tag.outputs.publish_typescript }}
      version_typescript: ${{ steps.tag.outputs.version_typescript }}
      publish_python: ${{ steps.tag.outputs.publish_python }}
      version_python: ${{ steps.tag.outputs.version_python }}
      publish_rust: ${{ steps.tag.outputs.publish_rust }}
      version_rust: ${{ steps.tag.outputs.version_rust }}
      publish_ruby: ${{ steps.tag.outputs.publish_ruby }}
      version_ruby: ${{ steps.tag.outputs.version_ruby }}
      publish_dart: ${{ steps.tag.outputs.publish_dart }}
      version_dart: ${{ steps.tag.outputs.version_dart }}
      publish_java: ${{ steps.tag.outputs.publish_java }}
      version_java: ${{ steps.tag.outputs.version_java }}
      publish_kotlin: ${{ steps.tag.outputs.publish_kotlin }}
      version_kotlin: ${{ steps.tag.outputs.version_kotlin }}
      publish_csharp: ${{ steps.tag.outputs.publish_csharp }}
      version_csharp: ${{ steps.tag.outputs.version_csharp }}
      publish_go: ${{ steps.tag.outputs.publish_go }}
      version_go: ${{ steps.tag.outputs.version_go }}
      publish_swift: ${{ steps.tag.outputs.publish_swift }}
      version_swift: ${{ steps.tag.outputs.version_swift }}
      publish_php: ${{ steps.tag.outputs.publish_php }}
      version_php: ${{ steps.tag.outputs.version_php }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # MUST be a PAT, not the default GITHUB_TOKEN.
          #
          # GitHub deliberately does not start a workflow run from an event
          # created with GITHUB_TOKEN — it is loop prevention. A tag pushed with
          # it is created perfectly and then triggers NOTHING, so publish.yml
          # never fires and the release silently stops halfway.
          #
          # This is not theoretical: misarmail-sdks and misarblog-sdks are wired
          # this way, and neither has ever run a publish workflow. Their Go
          # modules resolve only because proxy.golang.org serves straight from
          # the git tag without CI.
          #
          # Verified both ways on this repo: the same tag pushed by GITHUB_TOKEN
          # started no run; pushed by a user token it started publish.yml
          # immediately.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # Checked at runtime, not with `if:` — the `secrets` context is not
      # available in step conditionals, and referencing it there fails the whole
      # workflow at validation time with no job ever starting.
      - name: Warn if tags cannot trigger a publish
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::notice::RELEASE_TOKEN is not set. That is fine: the publish jobs below call publish.yml directly inside this run, so nothing depends on the tag raising an event. RELEASE_TOKEN now only matters as a fallback push token for split-standalone.yml."
          else
            echo "RELEASE_TOKEN present — tags will additionally raise a tag event, which publish.yml also listens for."
          fi

      - name: Tag every SDK whose version changed
        id: tag
        env:
          TARGETS: ${{ vars.SDK_PUBLISH_TARGETS }}
        run: |
          # SAFETY GATE. Tagging is releasing: publish.yml triggers on these
          # tags. SDK_PUBLISH_TARGETS names the languages allowed to be tagged;
          # unset means dry run, which is the default, because a bump that
          # touches every SDK would otherwise release the whole fleet at once
          # and a published version can never be replaced.
          #
          # Gating this loop is sufficient for the fleet and bare tags below:
          # both are conditioned on TAGGED > 0, which only increments here.
          GATE=",$(echo "${TARGETS:-}" | tr -d '[:space:]'),"
          if [ "$GATE" = ",," ]; then
            echo "::notice::SDK_PUBLISH_TARGETS is unset — DRY RUN, nothing will be tagged."
          else
            echo "::notice::Tagging enabled for: ${TARGETS}"
          fi

          set -euo pipefail

          # Read the shipped version out of one SDK's manifest at a given ref.
          # Prints nothing when the SDK has no manifest version (go, swift, php
          # are tag-versioned) or the file does not exist at that ref.
          version_at() {
            local ref="$1" lang="$2" file expr
            case "$lang" in
              typescript) file="typescript/package.json" ;;
              python)     file="python/pyproject.toml" ;;
              rust)       file="rust/Cargo.toml" ;;
              ruby)       file="ruby/misar_reach.gemspec" ;;
              dart)       file="dart/pubspec.yaml" ;;
              flutter)    file="flutter/pubspec.yaml" ;;
              java)       file="java/pom.xml" ;;
              kotlin)     file="kotlin/build.gradle.kts" ;;
              csharp)     file="csharp/MisarReach.csproj" ;;
              *)          return 0 ;;
            esac

            local content
            content="$(git show "${ref}:${file}" 2>/dev/null)" || return 0

            case "$lang" in
              typescript) printf '%s' "$content" | jq -r '.version // empty' ;;
              python|rust) printf '%s' "$content" | grep -m1 -E '^version[[:space:]]*=' | grep -oE '"[^"]+"' | tr -d '"' ;;
              ruby|kotlin) printf '%s' "$content" | grep -m1 -E 'version[[:space:]]*=' | grep -oE '"[^"]+"' | tr -d '"' ;;
              dart|flutter) printf '%s' "$content" | grep -m1 -E '^version:' | awk '{print $2}' ;;
              java) printf '%s' "$content" | grep -m1 -oE '<version>[^<]+</version>' | sed 's/<[^>]*>//g' ;;
              csharp) printf '%s' "$content" | grep -m1 -oE '<Version>[^<]+</Version>' | sed 's/<[^>]*>//g' ;;
            esac
          }

          # First push to a fresh mirror has no parent to diff against; tag
          # everything so the initial release is complete rather than empty.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREV="HEAD~1"
          else
            PREV=""
            echo "No parent commit — treating this as the initial release."
          fi

          git config user.name  "MisarReach CI"
          git config user.email "ci@misar.io"

          TAGGED=0
          for LANG in typescript python rust ruby dart java kotlin csharp; do
            NOW="$(version_at HEAD "$LANG" || true)"
            [ -n "$NOW" ] || continue

            if [ -n "$PREV" ]; then
              OLD="$(version_at "$PREV" "$LANG" || true)"
              if [ "$NOW" = "$OLD" ]; then
                echo "· $LANG unchanged at $NOW"
                continue
              fi
            fi

            TAG="$LANG/v$NOW"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "! $TAG already exists — refusing to move a released tag"
              continue
            fi

            if ! echo "$GATE" | grep -q ",${LANG}," && ! echo "$GATE" | grep -q ",all,"; then
              echo "🔒 would tag $TAG — withheld, $LANG not in SDK_PUBLISH_TARGETS"
              echo "- \`$TAG\` withheld (gate)" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            echo "+ $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            TAGGED=$((TAGGED + 1))
            # Recorded so the publish jobs below can run in THIS run rather than
            # waiting for a tag event that GITHUB_TOKEN will never raise.
            echo "publish_${LANG}=true" >> "$GITHUB_OUTPUT"
            echo "version_${LANG}=${NOW}" >> "$GITHUB_OUTPUT"
          done

          # go, swift and php carry no manifest version. They ride the release
          # of the fleet: tag them whenever anything else was tagged, using the
          # typescript version as the fleet version.
          if [ "$TAGGED" -gt 0 ]; then
            FLEET="$(version_at HEAD typescript || true)"
            if [ -n "$FLEET" ]; then
              for LANG in go swift php; do
                TAG="$LANG/v$FLEET"
                if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
                  echo "! $TAG already exists"
                  continue
                fi
                echo "+ $TAG (tag-versioned SDK, riding fleet version)"
                git tag "$TAG"
                git push origin "$TAG"
                echo "publish_${LANG}=true" >> "$GITHUB_OUTPUT"
                echo "version_${LANG}=${FLEET}" >> "$GITHUB_OUTPUT"
              done

              # Swift PM additionally needs a BARE semver tag. It reads versions
              # from the repository root and does not recognise a prefixed tag as
              # a version at all — `swift/v1.0.0` resolves to "no versions match".
              # Verified against a real consumer package: with only the prefixed
              # tag, resolution fails; with `v1.0.0` present it resolves to 1.0.0.
              #
              # Safe alongside Go, which needs the OPPOSITE convention: its module
              # lives in go/ so it is versioned by `go/vX.Y.Z`, and there is no
              # go.mod at the repository root for a bare tag to collide with.
              if git rev-parse -q --verify "refs/tags/v$FLEET" >/dev/null; then
                echo "! v$FLEET already exists"
              else
                echo "+ v$FLEET (bare tag — the only form Swift PM accepts)"
                git tag "v$FLEET"
                git push origin "v$FLEET"
              fi
            fi
          fi

          echo "Tagged $TAGGED versioned SDK(s)."

  # Each language publishes from inside THIS run, gated on the tag job having
  # actually cut its tag. `uses:` cannot be built from a variable, so this is one
  # literal job per language rather than a matrix.

  publish-typescript:
    needs: tag
    if: needs.tag.outputs.publish_typescript == 'true'
    permissions:
      contents: read
      id-token: write   # a called workflow can only narrow its caller's token
    uses: ./.github/workflows/publish.yml
    with:
      sdk: typescript
      version: ${{ needs.tag.outputs.version_typescript }}
    secrets: inherit

  publish-python:
    needs: tag
    if: needs.tag.outputs.publish_python == 'true'
    permissions:
      contents: read
      id-token: write   # a called workflow can only narrow its caller's token
    uses: ./.github/workflows/publish.yml
    with:
      sdk: python
      version: ${{ needs.tag.outputs.version_python }}
    secrets: inherit

  publish-rust:
    needs: tag
    if: needs.tag.outputs.publish_rust == 'true'
    permissions:
      contents: read
      id-token: write   # a called workflow can only narrow its caller's token
    uses: ./.github/workflows/publish.yml
    with:
      sdk: rust
      version: ${{ needs.tag.outputs.version_rust }}
    secrets: inherit

  publish-ruby:
    needs: tag
    if: needs.tag.outputs.publish_ruby == 'true'
    permissions:
      contents: read
      id-token: write   # a called workflow can only narrow its caller's token
    uses: ./.github/workflows/publish.yml
    with:
      sdk: ruby
      version: ${{ needs.tag.outputs.version_ruby }}
    secrets: inherit

  publish-dart:
    needs: tag
    if: needs.tag.outputs.publish_dart == 'true'
    permissions:
      contents: read
      id-token: write   # a called workflow can only narrow its caller's token
    uses: ./.github/workflows/publish.yml
    with:
      sdk: dart
      version: ${{ needs.tag.outputs.version_dart }}
    secrets: inherit


  publish-java:
    needs: tag
    if: needs.tag.outputs.publish_java == 'true'
    permissions:
      contents: read
      id-token: write   # a called workflow can only narrow its caller's token
    uses: ./.github/workflows/publish.yml
    with:
      sdk: java
      version: ${{ needs.tag.outputs.version_java }}
    secrets: inherit

  publish-kotlin:
    needs: tag
    if: needs.tag.outputs.publish_kotlin == 'true'
    permissions:
      contents: read
      id-token: write   # a called workflow can only narrow its caller's token
    uses: ./.github/workflows/publish.yml
    with:
      sdk: kotlin
      version: ${{ needs.tag.outputs.version_kotlin }}
    secrets: inherit

  publish-csharp:
    needs: tag
    if: needs.tag.outputs.publish_csharp == 'true'
    permissions:
      contents: read
      id-token: write   # a called workflow can only narrow its caller's token
    uses: ./.github/workflows/publish.yml
    with:
      sdk: csharp
      version: ${{ needs.tag.outputs.version_csharp }}
    secrets: inherit

  publish-go:
    needs: tag
    if: needs.tag.outputs.publish_go == 'true'
    permissions:
      contents: read
      id-token: write   # a called workflow can only narrow its caller's token
    uses: ./.github/workflows/publish.yml
    with:
      sdk: go
      version: ${{ needs.tag.outputs.version_go }}
    secrets: inherit

  # swift does not publish through publish.yml — Packagist and Swift PM read a
  # repository ROOT, so the release is the standalone repo that
  # split-standalone.yml populates and tags. Calling it here is what makes
  # that happen inside this run; its `push: tags:` trigger cannot fire for a
  # tag the tag job pushed with GITHUB_TOKEN.
  publish-swift:
    needs: tag
    if: needs.tag.outputs.publish_swift == 'true'
    uses: ./.github/workflows/split-standalone.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      language: swift
      version: ${{ needs.tag.outputs.version_swift }}
    secrets: inherit

  # php does not publish through publish.yml — Packagist and Swift PM read a
  # repository ROOT, so the release is the standalone repo that
  # split-standalone.yml populates and tags. Calling it here is what makes
  # that happen inside this run; its `push: tags:` trigger cannot fire for a
  # tag the tag job pushed with GITHUB_TOKEN.
  publish-php:
    needs: tag
    if: needs.tag.outputs.publish_php == 'true'
    uses: ./.github/workflows/split-standalone.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      language: php
      version: ${{ needs.tag.outputs.version_php }}
    secrets: inherit
