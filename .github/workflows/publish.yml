name: Publish SDK

# Fires on a per-SDK release tag: `<language>/vX.Y.Z`, e.g. `python/v1.0.0`.
# auto-tag.yml creates these from a manifest version bump; you can also push one
# by hand.
#
# Per-SDK tags rather than one fleet-wide version, so a Ruby fix does not burn a
# version number in eleven other registries. Tag-triggered rather than
# push-triggered because every registry here treats a published version as
# PERMANENT: npm's unpublish window is 72 hours, crates.io and the Go module
# proxy are immutable outright, and Maven Central has no delete at all.
#
# One file rather than twelve near-identical ones. The TAG CONVENTION matches
# misarmail-sdks and misarblog-sdks exactly — that is the part Go and the
# tooling actually depend on — but the twelve jobs share a single gate and a
# single place to fix a bug.
#
# FOUR registries need no stored credential here, because GitHub is a supported
# OIDC provider for all of them: PyPI Trusted Publishing, npm trusted publishing
# (GA 2025-07-31), pub.dev automated publishing, and NuGet trusted publishing.
# Those jobs mint a short-lived credential per run instead of reading a
# long-lived one out of a secret store, so there is nothing here to leak, rotate
# or forget.
#
# That matters more than usual on this repository: it has NO Actions secrets at
# all. Every job below that still needs one therefore fails loudly and names the
# secret it wants, rather than skipping and reporting a green run that published
# nothing — which is the state this repo was in.
#
# Each OIDC job carries the exact one-time setup the registry side needs. OIDC
# is a two-ended handshake: until the registry is told to trust
# Misar-AI/misarreach-sdks + publish.yml + the `release` environment, the token
# this workflow presents is just an unrecognised assertion.

on:
  push:
    tags: ['*/v*', 'v*']   # bare v* is the Swift PM release tag
  # Callable so auto-tag.yml can publish inside its OWN run. A tag pushed with
  # the default GITHUB_TOKEN starts no workflow (GitHub's loop prevention), so
  # the push: trigger above only fires for tags pushed by a human or a PAT.
  # Being called directly removes that dependency entirely.
  workflow_call:
    inputs:
      sdk:
        description: 'SDK to publish'
        required: true
        type: string
      version:
        description: 'Version (must match the manifest)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK to publish'
        required: true
        type: choice
        options: [typescript, python, rust, ruby, dart, java, kotlin, csharp, go, swift, php]
      version:
        description: 'Version (must match the manifest)'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Gate ──────────────────────────────────────────────────────────────────
  # Runs before any credential is touched, so a bad tag costs seconds and has
  # published nothing.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.parse.outputs.sdk }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: parse
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SDK="${{ inputs.sdk }}"; VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
            if [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              # A bare semver tag is the Swift release: Swift PM reads versions
              # from the repository root and does not accept a prefixed tag.
              SDK="swift"; VERSION="${BASH_REMATCH[1]}"
            elif [[ "$REF" =~ ^([a-z]+)/v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              SDK="${BASH_REMATCH[1]}"; VERSION="${BASH_REMATCH[2]}"
            else
              echo "::error::Tag '$REF' matches neither <language>/vX.Y.Z nor vX.Y.Z"
              exit 1
            fi
          fi

          KNOWN="typescript python rust ruby dart java kotlin csharp go swift php"
          if [[ " $KNOWN " != *" $SDK "* ]]; then
            echo "::error::Unknown SDK '$SDK'"; exit 1
          fi

          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $SDK $VERSION"

      # Refuses on a version/manifest mismatch, a missing LICENSE or README, a
      # publicly-404ing manifest URL, or a manifest no parser accepts.
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/check-sdk-release.mjs "${{ steps.parse.outputs.sdk }}" "${{ steps.parse.outputs.version }}"

  # ── npm: OIDC, no NPM_TOKEN ────────────────────────────────────────────────
  # ONE-TIME SETUP on npmjs.com, by a maintainer of the package:
  #   Packages → @misarreach/sdk → Settings → Trusted Publishing → GitHub Actions
  #     Organization or user: Misar-AI
  #     Repository:           misarreach-sdks
  #     Workflow filename:    publish.yml     ← filename only, no .github/workflows/ prefix
  #     Environment:          release         ← must equal the `environment:` below
  #     Allowed actions:      npm publish
  #
  # npm attaches a trusted publisher to a package that ALREADY EXISTS, and
  # @misarreach/sdk has never been published (registry 404 as of 2026-08-18). So
  # the first version has to go up by hand once — `npm publish --access public`
  # from a laptop — and every version after it comes from here with no stored
  # credential.
  npm:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'typescript'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write      # trusted publishing — the OIDC token IS the credential
    defaults: { run: { working-directory: typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # OIDC publishing needs npm >= 11.5.1, which node 20 does not ship —
          # it carries npm 10.x. node 24 does.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Require an npm new enough to publish with OIDC
        run: |
          set -euo pipefail
          # Asserted rather than assumed: on an older npm the publish does not
          # announce that OIDC is unavailable, it just fails needing a token
          # that this repo deliberately no longer has.
          #
          # Guarded on the VALUE. `npm --version | grep -q ... || echo missing`
          # would test the PIPELINE's status, and the last stage exits 0 on
          # empty input, so the fallback would never run.
          NPM_V="$(npm --version || true)"
          MIN=11.5.1
          if [ -z "$NPM_V" ]; then
            echo "::error::npm is not on PATH"; exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$NPM_V" "$MIN" | sort -V | head -n1)" != "$MIN" ]; then
            echo "::error::npm $NPM_V is older than $MIN, the first version that can publish over OIDC. Raise node-version in this job."
            exit 1
          fi
          echo "npm $NPM_V — OIDC publishing supported"

      - run: npm install --no-package-lock
      # tsc is incremental; a stale dist/ silently ships old code.
      - run: rm -rf dist && npx tsc
      - run: npm pack --dry-run
      # No NODE_AUTH_TOKEN, and no --provenance: under trusted publishing npm
      # generates and uploads the provenance attestation on its own.
      # NODE_AUTH_TOKEN is set from NPM_TOKEN when that secret exists, and is
      # empty otherwise. Empty means npm falls back to the OIDC credential, so
      # this keeps trusted publishing as the preferred path while still working
      # today: the trusted publisher cannot be configured on npmjs.com until the
      # package exists, and it does not exist yet. Delete this env block once the
      # trusted publisher is registered.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── PyPI: OIDC, no API token ───────────────────────────────────────────────
  # ONE-TIME SETUP on pypi.org:
  #   Account settings → Publishing → Add a new pending publisher → GitHub
  #     PyPI Project Name: misar-reach
  #     Owner:             Misar-AI
  #     Repository name:   misarreach-sdks
  #     Workflow name:     publish.yml
  #     Environment name:  release          ← must equal the `environment:` below
  #
  # PyPI is the only registry in this file that can be configured BEFORE the
  # project exists — a "pending publisher" creates the project on first use — so
  # unlike npm and pub.dev, python needs no manual first upload.
  pypi:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'python'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write      # Trusted Publishing — no API token is stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet build twine
      - run: python -m build
        working-directory: python
      - run: twine check python/dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  # ── crates.io: token ───────────────────────────────────────────────────────
  # Stays on a secret. Nothing here is skippable: without the token there is no
  # way to authenticate, so the job fails immediately rather than building for
  # three minutes and failing at the last step.
  crates:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'rust'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rust } }
    steps:
      - uses: actions/checkout@v4

      # `secrets` cannot be used in a step `if:` — referencing it there fails
      # the whole workflow at validation time — so this is a runtime check.
      - name: Require CARGO_REGISTRY_TOKEN
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set on this repository. crates.io cannot be published to without it. Add it under Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test
      - run: cargo publish --dry-run
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── RubyGems: token ────────────────────────────────────────────────────────
  # Stays on a secret.
  rubygems:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'ruby'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ruby } }
    steps:
      - uses: actions/checkout@v4

      # Without this the job happily writes a credentials file containing an
      # EMPTY api key and fails at `gem push` with an authentication error that
      # says nothing about the real cause.
      - name: Require RUBYGEMS_API_KEY
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "${RUBYGEMS_API_KEY:-}" ]; then
            echo "::error::RUBYGEMS_API_KEY is not set on this repository. RubyGems cannot be published to without it. Add it under Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - run: gem build misar_reach.gemspec
      - name: Publish
        run: |
          set -euo pipefail
          mkdir -p ~/.gem
          touch ~/.gem/credentials && chmod 0600 ~/.gem/credentials
          printf -- '---\n:rubygems_api_key: %s\n' "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          gem push ./*.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      - if: always()
        run: rm -f ~/.gem/credentials

  # ── NuGet: OIDC, no NUGET_API_KEY ──────────────────────────────────────────
  # ONE-TIME SETUP on nuget.org, signed in as the account (or org) that will own
  # the package:
  #   nuget.org → your username → Trusted Publishing → add a policy
  #     Repository Owner: Misar-AI
  #     Repository:       misarreach-sdks
  #     Workflow File:    publish.yml     ← filename only, no path
  #     Environment:      release         ← must equal the `environment:` below
  #
  # The policy is attached to a package OWNER, not to a package id, so it covers
  # Misar.Reach before that id exists — no manual first push needed here.
  #
  # Then set the repository VARIABLE (Settings → Secrets and variables → Actions
  # → Variables) NUGET_USER to that nuget.org profile name — the profile name,
  # not the email. It is a username, not a credential, so it is deliberately a
  # variable and not a secret.
  nuget:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'csharp'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write      # exchanged for a NuGet key that is valid for one hour
    defaults: { run: { working-directory: csharp } }
    steps:
      - uses: actions/checkout@v4

      - name: Require the NUGET_USER variable
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::repository variable NUGET_USER is not set. NuGet/login needs the nuget.org profile name that owns the trusted publishing policy. Add it under Settings → Secrets and variables → Actions → Variables (not Secrets — it is a username)."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build --configuration Release
      - run: dotnet pack --configuration Release --output ./nupkg

      # Requested as late as possible, immediately before the push: the minted
      # key expires after an hour, and each OIDC token buys exactly one key.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - run: dotnet nuget push "./nupkg/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

  # ── pub.dev: OIDC, no credentials file ─────────────────────────────────────
  # ONE-TIME SETUP on pub.dev, as an uploader on each package — TWO packages,
  # each configured separately:
  #   pub.dev/packages/misar_reach/admin         → Automated publishing →
  #     "Enable publishing from GitHub Actions"
  #       Repository:  Misar-AI/misarreach-sdks
  #       Tag-pattern: dart/v{{version}}
  #   Optionally tick "Require GitHub Actions environment" and enter `release`,
  #   which is the environment this job runs in.
  #
  # The tag-patterns are not cosmetic: pub.dev validates the ref inside the OIDC
  # token against them, so the tags auto-tag.yml already pushes are what must be
  # described. Two consequences worth knowing — a workflow_dispatch run can
  # never publish to pub.dev (its ref is a branch, not a matching tag), and
  # pub.dev cannot create a package, so v1.0.0 of each must be published by hand
  # with `dart pub publish` first.
  pub:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'dart'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write      # pub.dev automated publishing — no credentials file
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      # pub.dev's automated publishing is configured per EXISTING package, so it
      # cannot create the misarreach package on its first release.
      # When PUB_CREDENTIALS is present it is written to the credentials file and
      # used; when it is absent the step is skipped and the OIDC path applies
      # exactly as before. Remove this once both packages exist and automated
      # publishing is configured on pub.dev.
      - name: Use PUB_CREDENTIALS for the first publish, if provided
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${PUB_CREDENTIALS:-}" ]; then
            echo "PUB_CREDENTIALS not set — relying on pub.dev automated publishing (OIDC)."
            exit 0
          fi
          mkdir -p "$HOME/.config/dart" "$HOME/.pub-cache"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.pub-cache/credentials.json"
          chmod 600 "$HOME/.config/dart/pub-credentials.json" "$HOME/.pub-cache/credentials.json"
          echo "credentials installed"

      - run: dart pub get
        working-directory: ${{ needs.resolve.outputs.sdk }}
      - run: dart pub publish --dry-run
        working-directory: ${{ needs.resolve.outputs.sdk }}
      # `dart pub` prefers the OIDC token whenever GitHub injects
      # ACTIONS_ID_TOKEN_REQUEST_*, which it does because this job requests
      # id-token: write. OIDC cannot CREATE a package — pub.dev answers "Only
      # users are allowed to upload new packages" — so for a first publish the
      # credentials file has to win. Clearing those two variables is what makes
      # it fall back to the file we just wrote.
      - run: |
          set -euo pipefail
          if [ -n "${PUB_CREDENTIALS_PRESENT:-}" ]; then
            # PUB_TOKEN too, and it is the one that actually mattered:
            # dart-lang/setup-dart injects an OIDC-derived PUB_TOKEN whenever the
            # job has id-token: write, and pub prefers PUB_TOKEN over the
            # credentials file. With it set, every publish authenticated as the
            # OIDC principal and pub.dev answered "Only users are allowed to
            # upload new packages" — the credentials file was written, ignored,
            # and the failure looked like a bad credential rather than a
            # precedence problem.
            unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN PUB_TOKEN
            # setup-dart also records a token ENTRY for pub.dev in
            # pub-tokens.json that says "read this from $PUB_TOKEN". Unsetting the
            # variable alone leaves that entry dangling, and pub then refuses with
            # 'requires environment variable named "PUB_TOKEN" but not defined'.
            # The entry has to go as well, so the OAuth credentials file is the
            # only credential left standing.
            rm -f "$HOME/.config/dart/pub-tokens.json" "${PUB_CACHE:-$HOME/.pub-cache}/pub-tokens.json"
            dart pub token remove https://pub.dev 2>/dev/null || true
            echo "publishing with the credentials file"
          else
            echo "publishing over OIDC"
          fi
          dart pub publish --force
        env:
          PUB_CREDENTIALS_PRESENT: ${{ secrets.PUB_CREDENTIALS != '' && '1' || '' }}
        working-directory: ${{ needs.resolve.outputs.sdk }}

  # ── Maven Central: token + GPG ─────────────────────────────────────────────
  # No OIDC path exists here. Central authenticates with a portal token AND
  # verifies a GPG signature on every artifact against the public keyservers, so
  # all four secrets below are load-bearing.
  #
  # The two credential secrets were MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD
  # in this repo and OSSRH_USERNAME / OSSRH_TOKEN in misarmail-sdks and
  # misarblog-sdks: one Central credential pair under two names across the fleet,
  # so setting it up meant knowing which repo used which. Renamed to the sibling
  # spelling. Nothing has ever published from here, so the rename breaks nothing.
  maven:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'java' || needs.resolve.outputs.sdk == 'kotlin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ahead of setup-java, which is where the GPG key is imported: handed an
      # empty key it neither signs nor complains, and the failure resurfaces
      # much later as Central rejecting unsigned artifacts.
      - name: Require the Maven Central credentials
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          MISSING=""
          [ -n "${OSSRH_USERNAME:-}" ]  || MISSING="$MISSING OSSRH_USERNAME"
          [ -n "${OSSRH_TOKEN:-}" ]     || MISSING="$MISSING OSSRH_TOKEN"
          [ -n "${GPG_PRIVATE_KEY:-}" ] || MISSING="$MISSING GPG_PRIVATE_KEY"
          [ -n "${GPG_PASSPHRASE:-}" ]  || MISSING="$MISSING GPG_PASSPHRASE"
          if [ -n "$MISSING" ]; then
            echo "::error::missing secret(s):$MISSING — Maven Central needs a portal token (OSSRH_USERNAME/OSSRH_TOKEN) and a GPG signing key (GPG_PRIVATE_KEY/GPG_PASSPHRASE). Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          # These name the ENV VARS that the generated settings.xml reads, not
          # the values themselves.
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          # Central validates every signature against public keyservers and
          # rejects anything unsigned, so this is a hard requirement.
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - if: needs.resolve.outputs.sdk == 'java'
        run: mvn --batch-mode clean deploy
        working-directory: java
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # kotlin/build.gradle.kts publishes through com.vanniktech.maven.publish,
      # which reads Gradle properties — the ORG_GRADLE_PROJECT_ prefix is how an
      # env var becomes one. `gradle publish` with a plain maven repository could
      # never work here: the Central Portal URL is a bundle POST API, not a Maven
      # repo, so every per-file PUT 404s.
      - if: needs.resolve.outputs.sdk == 'kotlin'
        run: gradle publishToMavenCentral --no-daemon --no-configuration-cache
        working-directory: kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

  # ── Go: validate only ──────────────────────────────────────────────────────
  # There is nothing to upload. proxy.golang.org serves the module straight from
  # this repo's git tag, so the tag IS the release. All this job can usefully do
  # is prove the tagged tree compiles before anyone fetches it — and warm the
  # proxy so the first `go get` is instant rather than a cold fetch.
  go:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: go build ./... && go vet ./... && go test ./...
        working-directory: go
      - name: Warm the module proxy
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # The proxy escapes capitals as !<lower>, so Misar-AI is !misar-!a!i.
          # The version is plain semver: `go/` is part of the MODULE path, not
          # of the version, so the tag go/v1.2.3 is version v1.2.3 of the module
          # github.com/Misar-AI/misarreach-sdks/go. The old URL asked for a
          # version literally named `go/v1.2.3`, which cannot exist.
          URL="https://proxy.golang.org/github.com/!misar-!a!i/misarreach-sdks/go/@v/v${VERSION}.info"
          # Guarded on the VALUE. The old `curl … || echo` never fired: without
          # -f curl exits 0 on a 404, so the fallback was unreachable and a
          # missing module looked identical to a warmed one.
          INFO="$(curl -sS -f --max-time 30 "$URL" || true)"
          if [ -z "$INFO" ]; then
            echo "::notice::v${VERSION} is not indexed yet — the proxy will fetch it on the first \`go get\`"
          else
            echo "proxy already serves v${VERSION}: $INFO"
          fi

  # ── Swift: validate only ───────────────────────────────────────────────────
  # Swift PM consumers depend on this git URL directly; the tag is the release.
  # Package.swift must sit at the REPOSITORY ROOT, which is the whole reason this
  # mirror repo exists.
  swift:
    needs: resolve
    if: needs.resolve.outputs.sdk == 'swift'
    runs-on: ubuntu-latest
    # Linux on purpose: a macOS build passes while the package is unusable there,
    # because URLSession's async data(for:) and bytes(for:) do not exist in
    # swift-corelibs-foundation. Validating on the platform with the smaller
    # Foundation is what catches that.
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  # PHP has no job here. Packagist reads composer.json from a repository ROOT and
  # cannot index a subdirectory, so it tracks Misar-AI/misarreach-php — which
  # split-standalone.yml populates and tags. Both Packagist calls live there,
  # after the tag exists: the submission that registers the package in the first
  # place, and the re-crawl. Asking Packagist to look before the tag is pushed
  # just makes it re-read the previous release.
