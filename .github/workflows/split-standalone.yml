name: Split PHP/Swift to standalone repos

# Packagist cannot index a subdirectory and SwiftPM cannot resolve one, so those
# two SDKs are consumed from their own repositories with the package manifest at
# the root. This job keeps them from going stale.
#
# For Swift the tag IS the release: SwiftPM resolves versions from git tags in
# the repository it was pointed at, so the plain `vX.Y.Z` tag pushed here is what
# consumers get. For PHP, Packagist reads tags the same way and publish-php.yml
# pokes its update API afterwards.

on:
  push:
    tags: ['php/v*', 'swift/v*']
  workflow_call:
    inputs:
      language:
        description: 'Which SDK to split'
        required: true
        type: string
      version:
        description: 'Version to tag (without the leading v)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      language:
        description: 'Which SDK to split'
        required: true
        type: choice
        options: [php, swift]
      version:
        description: 'Version to tag (without the leading v)'
        required: true
        type: string

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve language and version
        id: target
        run: |
          if [ -n "${{ inputs.language }}" ]; then
            LANG="${{ inputs.language }}"
            VERSION="${{ inputs.version }}"
          else
            # refs/tags/php/v1.2.3 -> php, 1.2.3
            LANG="${GITHUB_REF#refs/tags/}"; LANG="${LANG%%/*}"
            VERSION="${GITHUB_REF##*/v}"
          fi
          case "$LANG" in
            php|swift) ;;
            *) echo "::error::unsupported language '$LANG'"; exit 1 ;;
          esac
          echo "lang=$LANG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=${GITHUB_REPOSITORY##*/}" | sed "s/-sdks/-$LANG/" >> "$GITHUB_OUTPUT"

      - name: Push the subdirectory to its standalone repository
        env:
          TOKEN: ${{ secrets.SPLIT_TOKEN || secrets.RELEASE_TOKEN || secrets.GH_SYNC_TOKEN }}
          LANG: ${{ steps.target.outputs.lang }}
          VERSION: ${{ steps.target.outputs.version }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::no push token available — set SPLIT_TOKEN (or RELEASE_TOKEN, or GH_SYNC_TOKEN) under Settings → Secrets and variables → Actions. Without one, ${TARGET} cannot be updated and the PHP/Swift release stops here."
            exit 1
          fi
          git clone --quiet \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${TARGET}.git" \
            /tmp/standalone

          # --delete so a file removed upstream is removed here too; the .git
          # directory is preserved because rsync targets the worktree only.
          rsync -a --delete --exclude .git --exclude vendor --exclude .build \
            "${LANG}/" /tmp/standalone/

          cd /tmp/standalone
          git config user.email "ci@misar.io"
          git config user.name "Misar CI"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::no content change; tagging the existing HEAD"
          else
            git commit -q \
              -m "chore: sync ${LANG} SDK v${VERSION} from the monorepo" \
              -m "Generated by split-standalone.yml. The monorepo is the source of truth."
          fi

          # Idempotent: re-running a release must not fail on an existing tag,
          # but must never move one either — a moved tag changes what a resolved
          # dependency points at.
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::notice::tag v${VERSION} already exists; leaving it alone"
          else
            git tag -a "v${VERSION}" -m "v${VERSION}"
          fi
          git push -q origin main
          git push -q origin "v${VERSION}"
          echo "::notice::${TARGET} now at v${VERSION}"

      # Submission comes before the re-crawl, because a package Packagist has
      # never heard of cannot be re-crawled. misarai/misarreach-php has never
      # been submitted (packagist.org redirects it to
      # /search/?…&reason=package_not_found as of 2026-08-18), which means every
      # tag pushed so far has published exactly nothing: `composer require
      # misarai/misarreach-php` still fails. Tagging is not releasing until the
      # package is registered once, and doing it here means nobody has to
      # remember to.
      #
      # Idempotent by design: this runs on every PHP release, and a package that
      # is already registered must be a no-op, not a failure.
      #
      # create-package requires the MAIN API token from
      # packagist.org/profile/ — the SAFE token is restricted to update-package
      # and is rejected here.

  # Registration is a pure API call against Packagist and needs no push
  # token, so it must not share the split job's fate. Previously it sat as a
  # later step inside that job: with SPLIT_TOKEN unset the push failed and
  # the package was never registered, even though nothing about registering
  # it required the token. `!cancelled()` rather than `always()` so a manual
  # cancellation still stops it.
  packagist:
    needs: split
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve language and version
        id: target
        run: |
          if [ -n "${{ inputs.language }}" ]; then
            LANG="${{ inputs.language }}"
            VERSION="${{ inputs.version }}"
          else
            # refs/tags/php/v1.2.3 -> php, 1.2.3
            LANG="${GITHUB_REF#refs/tags/}"; LANG="${LANG%%/*}"
            VERSION="${GITHUB_REF##*/v}"
          fi
          case "$LANG" in
            php|swift) ;;
            *) echo "::error::unsupported language '$LANG'"; exit 1 ;;
          esac
          echo "lang=$LANG"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=${GITHUB_REPOSITORY##*/}" | sed "s/-sdks/-$LANG/" >> "$GITHUB_OUTPUT"

      - name: Register the package on Packagist if it is not there yet
        if: steps.target.outputs.lang == 'php'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_USERNAME:-}" ] || [ -z "${PACKAGIST_API_TOKEN:-}" ]; then
            echo "::error::PACKAGIST_USERNAME and PACKAGIST_API_TOKEN are not both set. Without them the tag is pushed but nothing is published to Packagist. Add them under Settings → Secrets and variables → Actions; PACKAGIST_API_TOKEN must be the MAIN token, not the SAFE one."
            exit 1
          fi

          REPO_URL="https://github.com/${GITHUB_REPOSITORY_OWNER}/${TARGET}"
          OUT="$(mktemp)"
          # -o/-w rather than -f: a 4xx here is expected (already registered),
          # and the BODY is the only thing that distinguishes it from a real
          # failure. The credentials travel in the header, never in the URL.
          CODE="$(curl -sS --max-time 60 -o "$OUT" -w '%{http_code}' \
            -X POST 'https://packagist.org/api/create-package' \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"repository\":\"${REPO_URL}\"}" || true)"
          BODY="$(cat "$OUT")"; rm -f "$OUT"

          # Every branch below tests a VALUE. Testing the exit status of
          # `curl … | grep …` instead would be wrong twice over: curl without -f
          # succeeds on a 4xx, and the last stage of a pipe exits 0 on empty
          # input, so a `|| fallback` would never run.
          if [ -z "$CODE" ] || [ "$CODE" = "000" ]; then
            echo "::error::no HTTP response from packagist.org/api/create-package"
            exit 1
          fi

          case "$BODY" in
            *'"status":"success"'*)
              echo "::notice::registered ${REPO_URL} on Packagist"
              ;;
            *)
              if printf '%s' "$BODY" | grep -qiE 'already (exist|been|in use)|package .* exists'; then
                echo "::notice::${REPO_URL} is already registered on Packagist (HTTP ${CODE}) — nothing to do"
              else
                echo "::error::create-package failed (HTTP ${CODE}): ${BODY}"
                exit 1
              fi
              ;;
          esac

      # Only now that the tag exists AND the package is registered is it worth
      # asking Packagist to look. It reads composer.json from the repository
      # root and derives versions from tags, so a re-crawl requested earlier
      # would just re-read the previous release. No upload — this only makes it
      # crawl now rather than on its own schedule.
      - name: Ask Packagist to re-crawl
        if: steps.target.outputs.lang == 'php'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          TARGET: ${{ steps.target.outputs.target }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_USERNAME:-}" ] || [ -z "${PACKAGIST_API_TOKEN:-}" ]; then
            echo "::error::PACKAGIST_USERNAME and PACKAGIST_API_TOKEN are not both set — Packagist cannot be told about v${VERSION}."
            exit 1
          fi
          # The API wants the VCS URL it tracks, not the packagist.org page.
          OUT="$(mktemp)"
          CODE="$(curl -sS --max-time 60 -o "$OUT" -w '%{http_code}' \
            -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY_OWNER}/${TARGET}\"}}" || true)"
          BODY="$(cat "$OUT")"; rm -f "$OUT"
          case "$CODE" in
            200|202) echo "::notice::Packagist re-crawl requested for ${TARGET}" ;;
            *) echo "::error::update-package failed (HTTP ${CODE:-none}): ${BODY}"; exit 1 ;;
          esac
