[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misar-reach"
version = "1.0.0"
description = "Official Python SDK for MisarReach — lead finder, multi-channel outreach, deals/pipeline CRM, autopilot & sales agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Misar AI", email = "hello@misar.io" }]
keywords = ["misarreach", "leads", "lead-finder", "outreach", "crm", "sdk", "api"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://reach.misar.io"
Documentation = "https://reach.misar.io/docs"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "build", "twine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["misar_reach"]
