[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misar-reach"
version = "5.0.1"
description = "Sync + async client for MisarReach outreach & lead generation: a 23-source lead finder with SSE job streaming, contacts/deals/pipeline CRM, multi-channel campaigns, AI sales agent, autopilot and plan-usage reporting"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Misar AI", email = "hello@misar.io" }]
keywords = [
  "misarreach",
  "outreach",
  "lead-generation",
  "lead-finder",
  "prospecting",
  "sales-engagement",
  "cold-email",
  "crm",
  "pipeline",
  "campaigns",
  "sales-automation",
  "email-verification",
  "sse",
  "sdk",
  "api",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: AsyncIO",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://www.misarreach.com"
Documentation = "https://docs.misar.io/reach"
Repository = "https://github.com/Misar-AI/misarreach-sdks"
Source = "https://github.com/Misar-AI/misarreach-sdks/tree/main/python"
Issues = "https://github.com/Misar-AI/misarreach-sdks/issues"
Changelog = "https://github.com/Misar-AI/misarreach-sdks/blob/main/python/CHANGELOG.md"
"Parent project" = "https://misar.io"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "build", "twine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["misar_reach"]
