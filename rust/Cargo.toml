[package]
name = "misarreach"
version = "5.0.2"
edition = "2021"
description = "Async client for the MisarReach outreach and lead-generation API: lead-finder jobs across 23 sources with SSE progress streaming, CRM contacts, deals and pipeline, multi-step email/SMS/WhatsApp/push campaigns, an AI sales agent and autopilot, plus typed plan-limit refusals."
license = "MIT"
authors = ["Misar AI <hello@misar.io>"]
homepage = "https://www.misarreach.com"
repository = "https://github.com/Misar-AI/misarreach-sdks"
documentation = "https://docs.misar.io/reach"
keywords = ["outreach", "lead-generation", "crm", "sales-automation", "misarreach"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
readme = "README.md"
include = ["src/**/*", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
